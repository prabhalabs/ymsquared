<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      GitHub Pages has no server-side rewrites, so a hard refresh on a deep
      route like /privacy would 404. public/404.html encodes the requested
      path as a query string and redirects here; this decodes it back into a
      real path via history.replaceState before Vue Router ever reads the
      URL. See: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>YM² — Your Money Matters</title>
    <meta
      name="description"
      content="YM² (Your Money Matters) is a private, offline-first personal finance manager for Android. It reads your bank SMS to build your transaction history automatically, gives you a trustworthy Safe to Spend number, and helps you budget, save toward goals, and track bills — all on-device, with no account and no backend."
    />
    <meta name="theme-color" content="#f4f0e7" />
    <link rel="canonical" href="https://prabhalabs.github.io/ymsquared/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YM²" />
    <meta property="og:title" content="YM² — Your Money Matters" />
    <meta
      property="og:description"
      content="YM² — Your Money Matters. A private, offline-first money manager that reads your bank SMS to track transactions automatically, so you always know what's safe to spend — no account, no backend, nothing leaves your device."
    />
    <meta property="og:image" content="https://prabhalabs.github.io/ymsquared/og-image.png" />
    <meta property="og:url" content="https://prabhalabs.github.io/ymsquared/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YM² — Your Money Matters" />
    <meta
      name="twitter:description"
      content="YM² — Your Money Matters. A private, offline-first money manager that reads your bank SMS to track transactions automatically, so you always know what's safe to spend — no account, no backend, nothing leaves your device."
    />
    <meta name="twitter:image" content="https://prabhalabs.github.io/ymsquared/og-image.png" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts: Inter (body) + Manrope (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-ink antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
