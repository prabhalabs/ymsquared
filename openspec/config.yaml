schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Project: YM² marketing website (ymsquared-web) - a static marketing site
  for the YM² (Your Money Matters) Android app, deployed to GitHub Pages
  from https://github.com/prabhalabs/ymsquared.

  Tech stack: Vue 3 (Composition API) + TypeScript (strict) + Vite + Tailwind CSS
  + Vue Router + Heroicons + @lucide/vue. No Bootstrap/Vuetify/Nuxt/Pinia.

  Brand: "YM²" (YM SQUARED, full form "Your Money Matters") - tagline
  "Track. Understand. Grow." - private, offline-first, AI-assisted personal
  finance manager for Android that reads SMS/Gmail/manual entries entirely
  on-device. No ads, no analytics, no tracking, no selling data. Rebranded
  from "MFlow" in openspec/changes/rebrand-ym-squared/.

  Brand assets: source of truth is `src/assets/brand/icon.png` (see
  `scripts/generate-brand-assets.mjs` to regenerate every derived file from
  it). Per this repo's established naming convention (see README.md's
  "Brand assets" section): `logo-light.png` is the variant used on dark
  surfaces (navbar/footer), `logo-dark.png` is the variant used on light
  surfaces (e.g. the README).

  Color palette: primary #2563EB, secondary #14B8A6, accent #22C55E,
  background #020617, card #0F172A, border #1E293B, text white. Dark theme by
  default (no light theme toggle required). Fonts: Inter + Manrope.

  Pages required: / (landing), /privacy, /support, /terms, /404 (catch-all).
  Landing page needs: sticky navbar, hero w/ animated gradient + phone mockup +
  floating cards, feature grid (12 features), "Why YM²" grid (8 reasons),
  footer. Motion: scroll fade-ins, floating cards, gradient blobs, hover/ripple,
  glassmorphism, page transitions - all via CSS/Vue transitions, no animation
  libraries.

  Must be production-ready: strict TypeScript, reusable components, semantic
  HTML, accessible, SEO meta tags per page, optimized for Lighthouse >95, and
  configured to deploy to GitHub Pages (correct Vite `base`, GH Actions workflow
  or documented `gh-pages` deploy steps in README).

